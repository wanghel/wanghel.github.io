function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function unlock(pw){
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(DATA.iv)}, key, b64(DATA.ct));
  return new TextDecoder("utf-8").decode(plain);
}
var form = document.getElementById('gateForm'), err = document.getElementById('err'),
    btn = document.getElementById('go'), card = document.getElementById('card');
async function tryPw(pw, silent){
  btn.disabled = true; err.textContent = "";
  try {
    var html = await unlock(pw);
    try { sessionStorage.setItem("hw-gate", pw); } catch(e){}
    document.open(); document.write(html); document.close();
  } catch(e) {
    btn.disabled = false;
    if (!silent) {
      err.textContent = "that's not it — try again";
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    }
  }
}
form.addEventListener('submit', function(ev){ ev.preventDefault(); tryPw(document.getElementById('pw').value, false); });
(function(){
  var saved = null;
  try { saved = sessionStorage.getItem("hw-gate"); } catch(e){}
  if (saved) tryPw(saved, true);
})();
